name: samba-powershell
summary: PowerShell on Linux for Samba Active Directory administration.
version: 0.1.0
language:
  primary: python
  exceptions:
  - component: cmdlet surface
    language: powershell
    reason: A PowerShell module cannot be written in Python.
installs_on:
- domain-controller
- workstation
requires:
  samba_ad_domain: true
  modules:
  - name: samba-adws
    strength: depends
    reason: The cmdlets speak the web services protocol.
  debian_packages:
  - powershell
provides:
  commands:
  - samba-ad-backend
  - Get-ADUser
  - Get-ADComputer
  - Get-ADGroup
  - Get-ADObject
writes:
  config_dir: /etc/hardensamba/samba-powershell/
  paths:
  - /usr/bin/samba-ad-backend
  - /usr/lib/python3/dist-packages/samba_powershell/
  - /usr/lib/python3/dist-packages/samba_powershell-*.dist-info/
  - /usr/share/samba-powershell/
  - /usr/share/doc/samba-powershell/
  - /usr/share/man/man1/samba-ad-backend.1.gz
  - /usr/local/share/powershell/Modules/SambaAD/
  - /usr/local/bin/samba-ad-backend
  - /usr/local/lib/samba-powershell/