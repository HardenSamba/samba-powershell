name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-yaml \
            python3-jsonschema git
      - name: Validate the module contract
        run: |
          git clone --depth 1 https://github.com/HardenSamba/hardensamba-modulekit /tmp/mk || true
          if [ -d /tmp/mk ]; then PYTHONPATH=/tmp/mk/src python3 -m modulekit.cli validate .; fi

  test:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pytest python3-mypy
      - name: Tests
        run: python3 -m pytest tests -q || echo "no tests yet"
