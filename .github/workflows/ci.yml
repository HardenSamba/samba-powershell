name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  MK: /tmp/modulekit/src

jobs:
  contract:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-yaml python3-jsonschema git ca-certificates
      - name: Fetch the contract validator
        run: git clone --depth 1 https://github.com/HardenSamba/hardensamba-modulekit /tmp/modulekit
      - name: Validate the module contract
        run: PYTHONPATH=$MK python3 -m modulekit.cli validate .
      - name: Check the coding standard
        run: PYTHONPATH=$MK python3 -m modulekit.cli lint src
      - name: Check the coding standard in tests
        run: PYTHONPATH=$MK python3 -m modulekit.norms tests --require-headers --max-functions 50 --max-classes 5

  test:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pytest mypy ca-certificates
      - name: Types
        run: mypy --strict src
      - name: Tests
        run: PYTHONPATH=src python3 -m pytest tests -q
