name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pytest mypy ca-certificates
      - name: Types
        run: mypy --strict src
      - name: Tests
        run: PYTHONPATH=src python3 -m pytest tests -q
